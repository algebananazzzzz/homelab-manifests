apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-root
  namespace: argocd
spec:
  project: default
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    repoURL: git@github.com:algebananazzzzz/homelab-manifests.git
    targetRevision: main
    path: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
  # Ignore ALL auto-generated TLS certs in kube-system (Cilium, Hubble, etc.)
  - group: ""
    kind: Secret
    namespace: kube-system
    jqPathExpressions:
      - '.data.ca.crt'
      - '.data.ca.key'
      - '.data.tls.crt'
      - '.data.tls.key'