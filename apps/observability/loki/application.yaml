apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: default
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.51.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/apps/observability/loki/values.yaml
    - repoURL: git@github.com:algebananazzzzz/homelab-manifests.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
