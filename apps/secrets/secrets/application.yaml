apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/algebananazzzzz/homelab-manifests
    targetRevision: main
    path: apps/secrets/secrets/manifests
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
