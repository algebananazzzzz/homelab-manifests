apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 1.2.1
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/apps/secrets/external-secrets/values.yaml
    - repoURL: https://github.com/algebananazzzzz/homelab-manifests
      targetRevision: main
      ref: values
    - repoURL: https://github.com/algebananazzzzz/homelab-manifests
      targetRevision: main
      path: apps/secrets/external-secrets/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
