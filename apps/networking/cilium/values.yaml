cluster:
  name: kubernetes
cni:
  binPath: /opt/cni/bin

l2announcements:
  enabled: true

ingressController:
  enabled: true
  loadbalancerMode: dedicated
  default: true

gatewayAPI:
  enabled: true

hubble:
  relay:
    enabled: true
  ui:
    enabled: true

envoy:
  enabled: true
  
k8sClientRateLimit:
  burst: 20
  qps: 10

k8sServiceHost: 192.168.50.52
k8sServicePort: 6443

kubeProxyReplacement: true

operator:
  replicas: 1

routingMode: tunnel
tunnelProtocol: vxlan
